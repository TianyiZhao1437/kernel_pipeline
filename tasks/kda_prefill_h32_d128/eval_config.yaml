# Evaluation overrides for kda_prefill_h32_d128.
#
# Every number below was set by measurement on an H200 (torch 2.11.0+cu128,
# triton 3.6.0) against the real blob corpus, not by taste. The procedure and
# the raw numbers are reproducible with:
#
#     python3 tools/derive_kda_tolerances.py            # all four stages
#
# ---------------------------------------------------------------------------
# How the library actually combines rtol and atol
#
# This is the single most consequential fact in this file and it is not the
# intuitive one. flashinfer_bench/bench/utils.py:137 reads
#
#     exceeds_tol_mask = (abs_error > cfg.atol) & (rel_error > cfg.rtol)
#
# so an element FAILS only if it breaches BOTH bounds -- passing is an OR, and
# rel_error divides by |y| + 1e-8. A loose atol therefore does not merely widen
# the absolute bound, it excuses elements from the relative bound entirely.
#
# An earlier draft of this config was derived with a harness that required both
# bounds to pass. It reported that a bf16 tensor-core kernel scored 0.78 and
# was unacceptable -- which, had it been believed, would have forced fp32
# matmuls throughout and made the task's own premise (flops_model.py measures
# peak with bf16 bmm) unachievable. The harness was wrong, not the kernel.
#
# ---------------------------------------------------------------------------
# The output is small, so atol is the bound that does the work
#
# Measured over all 16 workloads:
#
#     core_attn_out   rms 4.7e-03 .. 6.4e-03    absmax 5.8e-02 .. 1.1e-01
#     final_state     rms 5.1e-02 .. 6.3e-02    absmax 7.6e-01 .. 1.4e+00
#
# core_attn_out has an RMS of ~5.5e-03. An atol of 1e-2 is therefore LARGER
# than a typical element, which excuses essentially the whole output tensor
# from the relative bound. Measured consequence at rtol=1e-2, atol=1e-2: a
# kernel that omits the UT transform entirely still scores 0.873, and one that
# drops the cross-chunk recurrence scores 0.979. Those are not subtle errors;
# they are different operators. atol has to be set against the output's scale.
#
# atol = 1e-3 is ~18% of the output RMS and ~1% of its absmax. That is still
# generous per element, but it is the value at which the measured separation
# below is widest without pushing a legitimate bf16 kernel under the bar.
#
# ---------------------------------------------------------------------------
# Floor: what a correct implementation differs by
#
# transformers ships recurrent_kimi_delta_attention, an O(T) sequential
# implementation of the same function -- T rank-1 updates against this
# reference's blocked matmuls and UT transform. Neither is more correct than
# the other, so their disagreement bounds what any correct kernel may show.
# Measured over 9 workloads spanning aligned, unaligned and batched shapes:
#
#     worst out    max_abs 2.441e-04   max_rel 7.264e-02
#     worst state  max_abs 2.593e-06   max_rel 6.659e-02
#     matched_ratio at (2e-2, 1e-3)   1.000000 on BOTH outputs
#
# Note the pointwise max_rel of 7.3e-02, which grows with element count and
# would look alarming as a threshold: those are near-zero elements. The ratio
# is flat at 1.000000 across every box tried down to (1e-2, 1e-4). As in
# hca_compress_c128, the bar has to be a ratio, not a pointwise max.
#
# So the floor is not the binding constraint here. Precision is.
#
# ---------------------------------------------------------------------------
# Ceiling: twelve variants, measured at rtol=2e-2 atol=1e-3
#
# Eight semantic mutations (each a plausible way to get KDA wrong, not an
# arbitrary perturbation) and four precision variants. The verdict is per
# output and a trace fails if any output exceeds, so the figure that decides a
# variant's fate is the MIN over core_attn_out and final_state -- the bolded
# column below.
#
#     variant       out ratio   state ratio   min      what it does
#     ----------------------------------------------------------------------
#     no_l2norm      0.003987     0.000589    0.0006   skips the q/k l2norm
#     no_cumsum      0.080405     0.006910    0.0069   per-token g, not cumsum
#     no_tail        0.715303     0.031736    0.0317   drops the ragged tail
#     decay_dir      0.652667     0.044708    0.0447   exp(g), not exp(g_T - g)
#     local          0.400916     0.159420    0.1594   no cross-chunk state
#     no_kbeta       0.579029     0.222269    0.2223   no beta weighting on k
#     no_vprime      0.530012     0.263855    0.2639   drops the v_prime term
#     no_ut          0.837426     0.456037    0.4560   omits the UT transform
#     ----------------------------------------------------------------------
#     bf16_state     1.000000     0.999369    0.9994   bf16 state-side matmuls
#     bf16_wy        1.000000     0.999839    0.9998   bf16 WY matmuls
#     bf16_accum     1.000000     0.999990    1.0000   bf16 state accumulator
#     bf16_matmul    1.000000     0.998156    0.9982   ALL matmuls in bf16
#
#     worst precision variant   0.998156
#     best semantic mutation    0.456037
#     gap                       54 percentage points
#
# required_matched_ratio = 0.99 sits in that gap with room on both sides.
#
# Two observations worth keeping:
#
#   * final_state is the discriminating output, not core_attn_out. Every
#     semantic mutation scores higher -- often far higher -- on the output than
#     on the state (no_tail: 0.715 vs 0.032; decay_dir: 0.653 vs 0.045). A
#     Definition that returned only core_attn_out would be markedly easier to
#     fake. This is the concrete reason final_state is a declared output rather
#     than an implementation detail.
#
#   * The precision variants lose nothing at all on the output (1.000000) and
#     only ~2e-3 of the state. A bf16 tensor-core kernel is comfortably inside
#     the bar, which is the intended outcome: this task is about recovering
#     large-GEMM throughput from small dependent tiles, and a tolerance that
#     banned the tensor cores would be measuring the wrong thing.
#
# bf16_accum (state accumulated in bf16 rather than fp32) is accepted at 1.0000
# and that is deliberate rather than an oversight. Its error does not grow with
# sequence length -- measured ||delta||/||out|| is 1.898e-03 at T=5000 against
# 1.899e-03 at T=2048 -- because the per-channel forget gate damps state error
# instead of compounding it (median channel memory is 15 tokens; see the
# measurements in tools/gen_kda_blobs.py). There is no accumulation argument
# against it here, so there is no reason to reject it.
#
# ---------------------------------------------------------------------------
# This file is load-bearing, not cosmetic
#
# Verified by resolving against the Definition through BenchmarkConfig:
# without it the defaults are rtol=0.01, atol=0.01, required_matched_ratio=None
# -- and compute_error_stats reads None as 1.0, i.e. EVERY element must clear
# one of the two bounds. At that setting a legitimate bf16 tensor-core kernel
# fails on final_state while a kernel with no UT transform passes on the
# output. Both halves of that are wrong, in opposite directions.
#
# ---------------------------------------------------------------------------
# iterations: trimmed, because the reference is slow and large
#
# The reference is the timing baseline and it materialises the full decay mask,
# [B, H, NC, C, C, D]. Measured per workload:
#
#     T=128     3.4 ms    0.42 GiB        T=4096    36.7 ms   12.57 GiB
#     T=2048   18.8 ms    6.30 GiB        T=16384  149.2 ms   50.16 GiB
#     sum over the 16-workload sweep: 686 ms per iteration
#
# At the stock warmup 5 / iterations 25 / trials 3 that is ~62 s of reference
# time alone per sweep. 3 / 10 / 3 brings it to ~27 s while leaving a fast
# kernel (single-digit ms at the largest workload) enough repetitions to time
# stably.


definition_config:
  kda_prefill_h32_d128:
    # Separation measured at this exact pair: worst legitimate bf16 kernel
    # 0.998156, best semantic mutation 0.456037. See the table above.
    rtol: 2.0e-2
    atol: 1.0e-3
    required_matched_ratio: 0.99
    # The reference peaks at 50 GiB and 149 ms at the largest workload, so trim
    # the repetition count rather than pay it 75 times per sweep.
    warmup_runs: 3
    iterations: 10
    num_trials: 3
    profile_baseline: true
