[project]
name = "kernel-pipeline"
version = "0.1.0"
description = "GPU kernel tasks and traces in the flashinfer-bench format, targeting H200."
requires-python = ">=3.10"

# flashinfer-bench comes from this project's fork, pinned to a commit -- never
# from PyPI. See third_party/VENDOR.md for why the reference is pinned rather
# than tracked, and third_party/patches/ for the patch series that the fork's
# commit now carries. The git source below is what binds the name.
#
# The revisions are pinned, not the branch. A fork branch would reintroduce
# exactly the drift VENDOR.md rules out: a push to the fork would change what
# this repository validates against with no commit here. Bumping the pin is a
# deliberate edit to `rev` below plus the table in VENDOR.md.
#
# No credential is embedded -- a token in a committed URL is a leak, and the
# repository is public, so a plain HTTPS fetch resolves it. Pushing to the fork
# still needs auth; that is a local git concern, not this file's.
dependencies = [
    "flashinfer-bench",
    "torch>=2.8.0",
    "safetensors>=0.5.0",
    "pyyaml>=6.0",
    "transformers>=5.0.0",   # tools/model_probe.py reads DeepSeek-V4 natively
    "huggingface-hub>=0.26",
]

[tool.uv.sources]
flashinfer-bench = { git = "https://github.com/TianyiZhao1437/flashinfer-bench.git", rev = "19acd0df4a4a3c456db034f4e6c9defc21d91c40" }

[tool.uv]
# This repository is scripts and data, not an importable package.
package = false

# Installing
# ----------
#
#     uv pip install --no-deps -e third_party/flashinfer-bench
#
# --no-deps is not optional. This environment pins torch 2.11.0+cu128 and
# triton 3.6.0 to match the host driver and the H200's compute capability; a
# resolver given a free hand can satisfy flashinfer-bench's `torch>=2.8.0` by
# replacing that pin with a CPU or wrong-CUDA wheel, and the failure shows up
# much later as "no kernel image is available for execution on the device".
# Every one of flashinfer-bench's seven dependencies is already present, so
# --no-deps resolves to exactly the editable link and nothing else.
#
# Editable, and pointed at the vendored tree, so that third_party/patches/ is
# live: `import flashinfer_bench` picks up the patched files with no build step
# and no PYTHONPATH prefix.
